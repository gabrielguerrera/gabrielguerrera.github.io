<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps do Gabriel</title>
  <meta name="description" content="Aplicativos publicados por Gabriel e suas políticas de privacidade.">
  <style>
    :root { --bg: #ffffff; --surface: #f8fafc; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .meta { color: var(--muted); margin: 0 0 24px; }
    .app { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
    .app h2 { font-size: 1.15rem; margin: 0 0 4px; }
    .app p { margin: 0 0 12px; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Apps do Gabriel</h1>
  <p class="meta">Contato: <a href="mailto:guerreragabriel@gmail.com">guerreragabriel@gmail.com</a></p>

  <section class="app">
    <h2>FlexReal: Álcool ou Gasolina</h2>
    <p>Calculadora que mostra se compensa abastecer com álcool ou gasolina pelo consumo real do seu veículo.</p>
    <a href="flexreal/privacidade/">Política de Privacidade</a>
  </section>
</main>
</body>
</html>
